<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title and description. Public collection/profile pages get their own
         Open Graph tags from the API for crawler requests (ADR-002); this is
         the fallback a browser tab and a plain link unfurl see. -->
    <title>Aggregator — save links, organise them, share the collection</title>
    <meta
      name="description"
      content="Aggregator is a bookmark manager built around collections. Save links, organise them into a tree you actually want to keep, then publish a collection as your public profile."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Matches the dark surface in docs/DESIGN.md, so mobile browser chrome
         does not flash a light bar above the app. -->
    <meta name="theme-color" content="#0b0f14" />

    <link
      rel="preload"
      href="/fonts/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
