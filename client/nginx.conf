# SPA fallback for TanStack Router + long-lived caching for hashed assets.
#
# Public pages (`/u/…`, `/share/…`, `/og/…`) are special: the API renders
# crawler-specific HTML for them (docs/decisions/002-public-page-rendering.md),
# because social crawlers fetch HTML and never execute JavaScript. Those routes
# are proxied to the API *only for crawlers*, identified by User-Agent.
#
# The alternative — proxying unconditionally and letting the API redirect
# browsers — deadlocks: the redirect target is the same path nginx just
# proxied, so the browser and nginx bounce forever. Routing by User-Agent keeps
# browsers entirely in the SPA and never involves the API.

# The API origin. Must match the API's own listen port.
map $http_user_agent $aggregator_is_crawler {
    default                       0;

    # Slack
    "Slackbot-LinkExpanding"      1;
    ~*slackbot                    1;
    ~*slack-imgproxy              1;

    # Twitter / X
    ~*twitterbot                  1;

    # Discord
    ~*discordbot                  1;

    # Facebook / Instagram / Threads
    ~*facebookexternalhit         1;
    ~*facebookcatalog             1;

    # LinkedIn
    ~*linkedinbot                 1;

    # Telegram, WhatsApp
    ~*telegrambot                 1;
    ~*whatsapp                    1;

    # Other common unfurlers
    ~*pinterest                   1;
    ~*redditbot                   1;
    ~*skypeuripreview             1;
    ~*embedly                     1;
    ~*opengraph                   1;
    ~*preview                     1;

    # Generic catch-alls. Anything containing these is treated as a bot.
    ~*bot                        1;
    ~*crawler                    1;
    ~*spider                     1;
}

upstream aggregator_api {
    # Overridden at deploy time; see the `API_UPSTREAM` build arg in
    # client/Dockerfile's compose file.
    server api:3001;
    keepalive 16;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Open Graph images. Never part of the SPA, so proxied for everyone — but
  # they are immutable per entity, so cache them hard.
  location /og/ {
    proxy_pass http://aggregator_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Crawler HTML for profiles and collections.
  location ~ ^/(u|share)/ {
    # Proxy headers live at the location level, not inside the `if`: nginx only
    # permits `proxy_pass` there, and the rest are inert when `try_files` wins
    # (the browser path). Verified by `nginx -t` in the image build.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # `proxy_pass` inside `if` is valid because the target has no URI part.
    # Browsers never take this branch; they fall through to `try_files`.
    if ($aggregator_is_crawler) {
      proxy_pass http://aggregator_api;
    }

    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}